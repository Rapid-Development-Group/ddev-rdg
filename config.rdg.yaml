#ddev-generated
# Installed by the ddev-rdg add-on.
#
# fail_on_hook_fail makes the pre-start guard authoritative: a project whose
# DDEV config has drifted from its Platform.sh config refuses to start rather
# than starting on stale values.
#
# The guard cannot fix the drift itself. A pre-start hook runs AFTER DDEV has
# parsed the config files, so anything it writes only takes effect on the next
# start. Failing loudly is the honest behaviour.
fail_on_hook_fail: true

# The theme daemon rdg-sync derives runs `yarn`, and the only `yarn` on PATH in
# ddev-webserver is the corepack shim that this setting creates. Shipping the
# daemon without its prerequisite gives a daemon that crash-loops 15 times
# printing "dependency install failed" and names the wrong cause. A scalar, so it
# overrides cleanly if a repo sets it too -- unlike the list keys rdg-sync emits.
corepack_enable: true

hooks:
  pre-start:
    - exec-host: "bash .ddev/rdg/check-sync.sh ."
    # Resolves 1Password references into .ddev/.env.web.op.local on every start, as
    # 'dkr up' did -- but never fails the start (see the script). Pre-start runs
    # before DDEV reads the .env.* files, so a refresh applies to this same start.
    # A no-op in a repo with no op:// references.
    - exec-host: "bash .ddev/rdg/op-secrets.sh . --hook"
