name: rdg

ddev_version_constraint: '>= 1.25.4'

# 1Password secrets on every start, as 'dkr up' had. Its own add-on so that repos
# which don't want this one (the Node apps) can still have it. DDEV installs it
# with this one, but skips it when it's already there: upgrade it on its own.
dependencies:
  - Rapid-Development-Group/ddev-1pass

project_files:
  - rdg/
  - config.rdg.yaml
  - providers/platform.yaml
  - providers/upsun.yaml
  - commands/host/rdg-sync
  - commands/host/upsun-db-pull
  - commands/host/upsun-files-pull
  - web-build/Dockerfile.rdg-theme-toolchain

post_install_actions:
  - |
    #ddev-nodisplay
    for f in rdg/*.sh; do [ -e "$f" ] && chmod +x "$f"; done
    # Named individually rather than commands/host/*: that directory also holds
    # host commands belonging to other add-ons, which are not ours to chmod.
    chmod +x commands/host/rdg-sync
    chmod +x commands/host/upsun-db-pull
    chmod +x commands/host/upsun-files-pull
  - |
    #ddev-nodisplay
    # Upgrade cleanup. Until v1.5.0 'ddev rdg-sync' GENERATED
    # web-build/Dockerfile.rdg-theme; it is now shipped as
    # web-build/Dockerfile.rdg-theme-toolchain instead. The generated file carries no
    # #ddev-generated marker, so DDEV will not remove it, and leaving it behind means the
    # toolchain is installed twice. Harmless (apt is idempotent) but confusing.
    rm -f web-build/Dockerfile.rdg-theme
  - |
    #ddev-description:Serving Mailpit's UI on a hostname
    # Every repo, in every mode, without anyone having to remember. DDEV serves
    # Mailpit on mailpit_http_port / mailpit_https_port against the BARE project
    # hostname, and one ddev-router serves every project -- so two projects on the
    # default 8025/8026 means whoever started first wins and you read the wrong
    # project's mail with nothing to tell you. A hostname is per-project by
    # construction.
    #
    # Not fatal if it cannot work out the project name: the script says so and
    # leaves the port-based URL alone.
    bash rdg/mailpit-hostname.sh .

# The three files 'ddev rdg-sync' generates carry no #ddev-generated marker (they
# carry their own "GENERATED by 'ddev rdg-sync'" header instead), so removal would
# otherwise leave them behind -- and config.platformsh.yaml declares a daemon whose
# script has just been deleted, with config.rdg.yaml gone too so no guard complains.
# The project would come up and crash-loop. Delete them with the add-on.
#
# providers/platform.yaml and providers/upsun.yaml are deliberately NOT listed:
# removal is marker-gated, and both files omit the marker on purpose so DDEV never
# regenerates them. They are left behind; delete them by hand if unwanted.
removal_actions:
  - |
    #ddev-nodisplay
    # Both names: a repo is one shape or the other, but a repo that changed shape
    # can briefly hold both, and neither carries the #ddev-generated marker.
    rm -f config.platformsh.yaml config.upsun.yaml
  - |
    #ddev-nodisplay
    rm -f nginx/platform-locations.conf
  - |
    #ddev-nodisplay
    # The Mailpit hostname pair. Neither carries #ddev-generated -- DDEV would
    # regenerate traefik/config/ over the top of the router if it did -- so removal
    # has to name them.
    rm -f traefik/config/mailpit.yaml config.mailpit.yaml
  - |
    #ddev-nodisplay
    # Guarded, unlike the two above: 'ddev redis-backend' writes this same file
    # without the marker, and that one is the developer's, not ours.
    if [ -f .env.redis ] && grep -q '#ddev-generated' .env.redis; then rm -f .env.redis; fi
