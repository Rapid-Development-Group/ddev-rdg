name: rdg

ddev_version_constraint: '>= 1.24.8'

project_files:
  - rdg/
  - config.rdg.yaml
  - providers/platform.yaml
  - commands/host/rdg-sync
  - commands/host/upsun-db-pull
  - commands/host/upsun-files-pull
  - web-build/Dockerfile.rdg-theme-toolchain

post_install_actions:
  - |
    #ddev-nodisplay
    for f in rdg/*.sh; do [ -e "$f" ] && chmod +x "$f"; done
    # Named individually rather than commands/host/*: that directory also holds
    # host commands belonging to other add-ons, which are not ours to chmod.
    chmod +x commands/host/rdg-sync
    chmod +x commands/host/upsun-db-pull
    chmod +x commands/host/upsun-files-pull
  - |
    #ddev-nodisplay
    # Upgrade cleanup. Until v1.5.0 'ddev rdg-sync' GENERATED
    # web-build/Dockerfile.rdg-theme; it is now shipped as
    # web-build/Dockerfile.rdg-theme-toolchain instead. The generated file carries no
    # #ddev-generated marker, so DDEV will not remove it, and leaving it behind means the
    # toolchain is installed twice. Harmless (apt is idempotent) but confusing.
    rm -f web-build/Dockerfile.rdg-theme

# The three files 'ddev rdg-sync' generates carry no #ddev-generated marker (they
# carry their own "GENERATED by 'ddev rdg-sync'" header instead), so removal would
# otherwise leave them behind -- and config.platformsh.yaml declares a daemon whose
# script has just been deleted, with config.rdg.yaml gone too so no guard complains.
# The project would come up and crash-loop. Delete them with the add-on.
#
# providers/platform.yaml is deliberately NOT listed: removal is marker-gated, and
# that file omits the marker on purpose so DDEV never regenerates it. It is left
# behind; delete it by hand if unwanted.
removal_actions:
  - |
    #ddev-nodisplay
    rm -f config.platformsh.yaml
  - |
    #ddev-nodisplay
    rm -f nginx/platform-locations.conf
